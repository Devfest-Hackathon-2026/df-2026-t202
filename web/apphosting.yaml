# Firebase App Hosting config for web/ (set the backend root directory to "web").
# Next.js has preconfigured build and deploy support. NEXT_PUBLIC_* values are inlined at build time
# and are public by design. Secrets are referenced by name only.
runConfig:
  minInstances: 0
  maxInstances: 4

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE-PROJECT-ID.firebaseapp.com
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE-PROJECT-ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE-APP-ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_MAPS_BROWSER_KEY
    secret: maps-browser-key
    availability: [BUILD]
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://REPLACE-cloud-run-url
    availability: [BUILD]
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: REPLACE-recaptcha-site-key
    availability: [BUILD]
