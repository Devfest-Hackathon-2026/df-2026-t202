# Firebase App Hosting config for web/ (set the backend root directory to "web").
# Next.js has preconfigured build and deploy support. NEXT_PUBLIC_* values are inlined at build time
# and are public by design. Secrets are referenced by name only.
runConfig:
  minInstances: 0
  maxInstances: 4

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: project-feeadd8d-4702-4a48-9ac.firebaseapp.com
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: project-feeadd8d-4702-4a48-9ac
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:130676635480:web:f2fea71e692985ac18972d
    availability: [BUILD]
  - variable: NEXT_PUBLIC_MAPS_BROWSER_KEY
    secret: maps-browser-key
    availability: [BUILD]
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://trip-api-130676635480.asia-northeast1.run.app
    availability: [BUILD]
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdMdBYuAAAAALFRPDuF55MGohloc7DECutWtp2g
    availability: [BUILD]
