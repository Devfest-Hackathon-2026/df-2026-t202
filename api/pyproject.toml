[project]
name = "trip-planner-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
# models.py is the shared contract, copied word for word from the team spec. Never auto-fix or reformat it.
extend-exclude = ["app/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
